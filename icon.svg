<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="sectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="480" height="480" x="16" y="16" rx="110" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="8" />
  <!-- Outer Clock Rim -->
  <circle cx="256" cy="256" r="196" fill="#ffffff" stroke="#1e293b" stroke-width="14" filter="url(#shadow)" />
  <!-- Countdown Wedge (270 degrees) -->
  <path d="M 256 256 L 256 76 A 180 180 0 1 1 76 256 Z" fill="url(#sectorGrad)" />
  <!-- Tick Marks -->
  <g stroke="#1e293b" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="68" x2="256" y2="92" />
    <line x1="444" y1="256" x2="420" y2="256" />
    <line x1="256" y1="444" x2="256" y2="420" />
    <line x1="68" y1="256" x2="92" y2="256" />
  </g>
  <!-- Center Cap -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="10" />
  <circle cx="256" cy="256" r="10" fill="#ef4444" />
</svg>
